# LAYER 1 - Splunk configuration. HARDENED.
#
#   diff -u collection/splunk-extraction/props.conf \
#           solution/collection/splunk-extraction/props.conf
#
# Same story as transforms.conf: the starter was correct for single-quoted
# Windows XML. It stopped working when a normalising hop re-serialised the
# events with double quotes.
#
# TIME_PREFIX is the second casualty of that one change, and the more dangerous
# one, because it fails so quietly.

[workshop:sysmon_raw]

SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)<Event\s
TRUNCATE = 999999

# --- Timestamp ------------------------------------------------------------
# TIME_PREFIX takes a literal string, not a regex, so it cannot be made
# tolerant of both quote styles the way the extraction regex can. Two ways out:
#
#   A. Drop the quote from the prefix and let MAX_TIMESTAMP_LOOKAHEAD carry it.
#      Splunk starts scanning for a timestamp right after "SystemTime=" and
#      skips the quote character as leading noise. Works for both styles.
#      That is what is configured below.
#
#   B. Normalise the data upstream and keep the exact prefix.
#
# Option A is what you can do without owning the producer. Verify it rather
# than assuming it, because "Splunk found a timestamp" and "Splunk found the
# RIGHT timestamp" are different claims:
#
#   index=... | eval drift=_indextime-_time | table _time _indextime drift
#
# Seconds means it parsed. Months means it silently fell back to index time and
# has been lying to you for however long the data has been arriving.
TIME_PREFIX = <TimeCreated SystemTime=
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%7N%Z
MAX_TIMESTAMP_LOOKAHEAD = 45

KV_MODE = none

REPORT-sysmon_eventdata = sysmon_eventdata
REPORT-sysmon_system    = sysmon_system
REPORT-sysmon_computer  = sysmon_computer

# --------------------------------------------------------------------------
# XML entity decoding. See the long note at the end of transforms.conf.
#
# Extracted values are still XML-encoded, so a command line containing & holds
# the literal five characters &amp; and `CommandLine="*& {IEX*"` finds nothing.
#
# ORDER MATTERS: &amp; is decoded LAST. Verified:
#
#   stored text            &amp; first        &amp; last
#   echo &amp;lt;div&amp;gt;   echo <div>   X    echo &lt;div&gt;   OK
#
# Decoding &amp; first turns an escaped literal into a real character.
#
# Uncomment to fix at search time. Better: decode at ingest, so no consumer
# downstream needs to know this.
# --------------------------------------------------------------------------
# EVAL-CommandLine = replace(replace(replace(replace(replace(CommandLine, "&lt;", "<"), "&gt;", ">"), "&quot;", "\""), "&#39;", "'"), "&amp;", "&")
# EVAL-ParentCommandLine = replace(replace(replace(replace(replace(ParentCommandLine, "&lt;", "<"), "&gt;", ">"), "&quot;", "\""), "&#39;", "'"), "&amp;", "&")

# --------------------------------------------------------------------------
# Also worth knowing: KV_MODE = xml
#
# Splunk can parse the XML itself, and it handles both quote styles, so it
# sidesteps this entire problem. What it does NOT give you is flat field names:
# you get the document's structure as nested paths and multivalue fields, so
# `Image` still does not exist as a field and your Sigma-generated SPL still
# finds nothing.
#
# Correct and useless here. The transform is fiddly and gives you the field
# names the rule actually asks for.
# --------------------------------------------------------------------------
