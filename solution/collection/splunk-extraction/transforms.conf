# LAYER 1 - search-time field extraction. HARDENED.
#
#   diff -u collection/splunk-extraction/transforms.conf \
#           solution/collection/splunk-extraction/transforms.conf
#
# The starter config was not broken. It was correct for single-quoted Windows
# XML, exactly like the real Splunk TA. It extracted 23 of 23 fields from
# collection/sysmon-eid1-encoded-ps.xml.
#
# It extracted 0 of 23 from collection/sysmon-eid1-encoded-ps-dquote.xml, which
# is the same event after one normalising hop re-serialised the XML with double
# quotes.
#
# This file is option A of two. Read the trade-off below before adopting it.

# --------------------------------------------------------------------------
# OPTION A - make the parser tolerant of both quote styles.
#
#   Name=['"]([^'"]+)['"]
#
# Measured:
#                                  single-quoted   double-quoted
#   TA regex  (single only)             23              0
#   this regex (either)                 23             23
#
# Strictly this also matches a mismatched Name='Image", which no real producer
# emits. That is the right trade: a regex slightly too permissive extracts your
# data; a regex slightly too strict extracts nothing and says nothing.
#
# WHAT IT COSTS YOU. You now own a fork of the TA's extraction logic. When the
# TA updates, your version does not. When somebody debugs field extraction in
# two years they will find two definitions and have to work out which one is
# live. Tolerance is not free, it is deferred maintenance.
# --------------------------------------------------------------------------
[sysmon_eventdata]
REGEX = <Data Name=['"]([^'"]+)['"]>([^<]*)</Data>
FORMAT = $1::$2
MV_ADD = true

[sysmon_system]
REGEX = <EventID>(?<EventCode>\d+)</EventID>
FORMAT = EventCode::$1
MV_ADD = false

[sysmon_computer]
REGEX = <Computer>([^<]+)</Computer>
FORMAT = Computer::$1
MV_ADD = false

# --------------------------------------------------------------------------
# OPTION B - normalise at the source, and keep the parser strict.
#
# Nothing to configure here, which is the point. You go and find the hop that
# re-serialised the XML and either remove it or make it preserve the original
# bytes. The TA stays stock, the extraction stays strict, and every other
# consumer of that data is fixed at the same time.
#
# WHAT IT COSTS YOU. You probably do not own that hop. It may belong to a
# platform team, it may be a vendor appliance, and it was almost certainly
# added for a reason that has nothing to do with detection. Option B is
# correct and slow. Option A is expedient and yours to maintain.
#
# WHAT TO ACTUALLY DO. Usually both, in this order: option A today so the
# detections work, option B raised as a ticket so the fork can be removed
# later. What you must not do is option A silently, with no ticket and no
# comment, because then the fork is permanent and nobody knows why it exists.
#
# AND THE PART THAT OUTLIVES THIS WORKSHOP: add a monitor. If your extraction
# depends on the shape of incoming data, then a change in that shape is an
# outage you will not otherwise be told about:
#
#   index=... sourcetype=workshop:sysmon_raw earliest=-1h
#   | stats count, count(Image) as extracted
#   | eval pct=round(100*extracted/count, 1)
#   | where pct < 95
#
# Alert on that. It catches this failure, the entity failure below, a TA
# upgrade that changes field names, and the producer changing its output
# format. All of which are silent today.
# --------------------------------------------------------------------------

# --------------------------------------------------------------------------
# A SEPARATE PROBLEM, which neither option fixes: XML ENTITIES.
#
# Extracted values are still XML-encoded, because that is literally what is in
# the document. A command line containing & arrives in the field as &amp;:
#
#   file:  <Data Name='CommandLine'>... -Command "&amp; {IEX ...}" ...</Data>
#   field: ... -Command "&amp; {IEX ...}" ...
#
# So this matches nothing, while the event sits right there in the index:
#
#   index=... CommandLine="*& {IEX*"
#
# and this matches:
#
#   index=... CommandLine="*&amp; {IEX*"
#
# Nobody writes a Sigma rule against &amp;. Your detection looks for the decoded
# string; your index holds the encoded one. Command lines contain & and >
# constantly (redirection, PowerShell's call operator), so this is not a corner
# case. Try it with collection/sysmon-eid1-quotes.xml.
#
# Fix it at ingest if you can. If you cannot, there is an EVAL in props.conf,
# commented out, and one rule about it: decode &amp; LAST. Decode it first and
# the stored text "&amp;lt;" becomes "&lt;" becomes "<", turning an escaped
# literal into a real character. That is a double-decode bug, the same class of
# mistake that earns XML parsers CVEs.
# --------------------------------------------------------------------------
