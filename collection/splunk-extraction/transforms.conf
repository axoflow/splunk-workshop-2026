# LAYER 1 - search-time field extraction for raw Sysmon XML.
#
# THIS CONFIG IS CORRECT. Do not start by looking for a bug in it.
#
# It mirrors what Splunk_TA_microsoft_sysmon does: match single-quoted XML
# attributes, because that is what the Windows Event Log emits.
#
#   <Data Name='Image'>C:\Windows\...\powershell.exe</Data>
#         ^     ^
#
# Verified against collection/sysmon-eid1-encoded-ps.xml: 23 of 23 fields
# extracted.
#
# Stage 3 of the lab is not "find the bug in this file". It is: work out why
# this correct config extracts nothing from an event that is also correct.

[sysmon_eventdata]
REGEX = <Data Name='([^']+)'>([^<]*)</Data>
FORMAT = $1::$2
MV_ADD = true

[sysmon_system]
REGEX = <EventID>(?<EventCode>\d+)</EventID>
FORMAT = EventCode::$1
MV_ADD = false

[sysmon_computer]
REGEX = <Computer>([^<]+)</Computer>
FORMAT = Computer::$1
MV_ADD = false
