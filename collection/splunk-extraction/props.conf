# LAYER 1 - Splunk index-time and search-time configuration.
#
# THIS CONFIG IS CORRECT, in the same way transforms.conf is correct: it is
# written for the single-quoted XML the Windows Event Log emits.
#
# Drop it in $SPLUNK_HOME/etc/apps/workshop_extraction/local/ alongside
# transforms.conf, or paste the equivalents into
# Settings > Fields > Field Extractions.

[workshop:sysmon_raw]

# --- Event boundaries -----------------------------------------------------
# Without this, Splunk breaks the XML document into one event per line and you
# get forty useless events instead of one useful one.
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)<Event\s
TRUNCATE = 999999

# --- Timestamp ------------------------------------------------------------
# Matches what Windows writes:
#
#   <TimeCreated SystemTime='2024-04-28T22:11:47.336104100Z' />
#
# %7N covers Sysmon's seven fractional digits. (%6N also "works": it truncates
# and still produces a plausible timestamp. One of many ways to be almost
# right.)
#
# Note how this fails if it ever stops matching: Splunk does not error, it
# falls back to INDEX TIME. Every event lands at "now", searches keep working,
# dashboards keep populating, and you find out weeks later when an incident
# timeline does not line up.
#
# Check it, on any sourcetype, any time:
#   index=... | eval drift=_indextime-_time | table _time _indextime drift
# Seconds means it parsed. Months means it did not.
TIME_PREFIX = <TimeCreated SystemTime='
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%7N%Z
MAX_TIMESTAMP_LOOKAHEAD = 40

# --- Field extraction -----------------------------------------------------
# KV_MODE = none so the transforms below are the only thing making fields.
# Keeps the exercise unambiguous: if a field appears, you know what produced it.
KV_MODE = none

REPORT-sysmon_eventdata = sysmon_eventdata
REPORT-sysmon_system    = sysmon_system
REPORT-sysmon_computer  = sysmon_computer
